<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuraPlant</title>
</head>
<body>
  <h1>AuraPlant BLE test</h1>
  <button id="connectBtn">Connect</button>
  <button id="sendBtn" disabled>Send "R:WATER"</button>
  <pre id="log"></pre>

<script>
// UUIDs from nRF Connect (Nordic UART Service)
const SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // we WRITE here
const TX      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // we LISTEN here

let rxChar;
const log = (t) => document.getElementById("log").textContent += t + "\n";

document.getElementById("connectBtn").onclick = async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE]
    });
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    rxChar = await service.getCharacteristic(RX);
    const txChar = await service.getCharacteristic(TX);

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", (e) => {
      log("Device says: " + new TextDecoder().decode(e.target.value));
    });

    log("Connected!");
    document.getElementById("sendBtn").disabled = false;
  } catch (err) {
    log("Error: " + err);
  }
};

document.getElementById("sendBtn").onclick = async () => {
  await rxChar.writeValueWithoutResponse(new TextEncoder().encode("R:WATER\n"));
  log("Sent R:WATER");
};
</script>
</body>
</html>
